name: Build Koofr Catalogue Preview

run-name: Build Koofr catalogue preview on ${{ github.ref_name }}

on:
  push:
    branches:
      - arsip-kuliner-surabaya
    paths:
      - "scripts/build-koofr-catalog.py"
      - ".github/workflows/build-koofr-catalog-preview.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: koofr-catalogue-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-catalogue:
    name: Scan Koofr and build preview catalogue
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      KOOFR_USERNAME: ${{ secrets.KOOFR_USERNAME }}
      KOOFR_APP_PASSWORD: ${{ secrets.KOOFR_APP_PASSWORD }}
      KOOFR_WEBDAV_URL: https://app.koofr.net/dav/Koofr/
      KOOFR_ARCHIVE_FOLDER: Arsip Kuliner Surabaya

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${KOOFR_USERNAME:-}" ]]; then
            echo "::error::Repository secret KOOFR_USERNAME belum tersedia atau kosong."
            exit 1
          fi

          if [[ -z "${KOOFR_APP_PASSWORD:-}" ]]; then
            echo "::error::Repository secret KOOFR_APP_PASSWORD belum tersedia atau kosong."
            exit 1
          fi

          echo "Required Koofr secrets are available."

      - name: Validate Python script
        shell: bash
        run: |
          set -euo pipefail

          python3 -m py_compile scripts/build-koofr-catalog.py

          echo "Python syntax validation passed."

      - name: Build catalogue from Koofr
        shell: bash
        run: |
          set -euo pipefail

          rm -rf generated
          mkdir -p generated

          python3 scripts/build-koofr-catalog.py \
            --output generated/archive.json

      - name: Validate generated JSON
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PYTHON'
          import json
          from pathlib import Path


          ALLOWED_REGIONS = [
              "Surabaya Barat",
              "Surabaya Pusat",
              "Surabaya Selatan",
              "Surabaya Timur",
              "Surabaya Utara",
          ]

          path = Path("generated/archive.json")

          if not path.is_file():
              raise SystemExit(
                  "::error::generated/archive.json tidak ditemukan."
              )

          with path.open("r", encoding="utf-8") as input_file:
              catalogue = json.load(input_file)

          if catalogue.get("schemaVersion") != 1:
              raise SystemExit(
                  "::error::schemaVersion archive.json harus bernilai 1."
              )

          regions = catalogue.get("regions")

          if not isinstance(regions, list):
              raise SystemExit(
                  "::error::regions harus berbentuk array."
              )

          region_names = [
              region.get("name")
              for region in regions
              if isinstance(region, dict)
          ]

          if region_names != ALLOWED_REGIONS:
              raise SystemExit(
                  "::error::Daftar atau urutan wilayah tidak sesuai allowlist."
              )

          if "Folder Karantina" in json.dumps(
              catalogue,
              ensure_ascii=False,
          ):
              raise SystemExit(
                  "::error::Folder Karantina ditemukan dalam output."
              )

          for region in regions:
              for key in (
                  "districtCount",
                  "placeCount",
                  "mediaCount",
              ):
                  value = region.get(key)

                  if (
                      not isinstance(value, int)
                      or value < 0
                  ):
                      raise SystemExit(
                          f"::error::{region.get('name')} memiliki {key} yang tidak valid."
                      )

          print("Generated catalogue validation passed.")
          print(f"JSON size: {path.stat().st_size:,} bytes.")
          PYTHON

      - name: Upload catalogue preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: koofr-catalogue-preview
          path: generated/archive.json
          if-no-files-found: error
          retention-days: 7

      - name: Report completion
        shell: bash
        run: |
          echo "Koofr catalogue preview completed."
          echo "The generated JSON was uploaded as a workflow artifact."
          echo "No repository file or Koofr resource was changed."

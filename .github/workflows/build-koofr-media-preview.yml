name: Build Koofr Media Preview
run-name: Build Koofr media preview on ${{ github.ref_name }}
on:
  push:
    branches:
      - arsip-kuliner-surabaya
    paths:
      - scripts/build-koofr-catalog.py
      - scripts/build-koofr-media-previews.py
      - .github/workflows/build-koofr-media-preview.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: koofr-media-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-media-preview:
    name: Download and convert Koofr images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KOOFR_USERNAME: ${{ secrets.KOOFR_USERNAME }}
      KOOFR_APP_PASSWORD: ${{ secrets.KOOFR_APP_PASSWORD }}
      KOOFR_WEBDAV_URL: https://app.koofr.net/dav/Koofr/
      KOOFR_ARCHIVE_FOLDER: Arsip Kuliner Surabaya
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${KOOFR_USERNAME:-}" ]]; then
            echo "::error::Repository secret KOOFR_USERNAME belum tersedia atau kosong."
            exit 1
          fi
          if [[ -z "${KOOFR_APP_PASSWORD:-}" ]]; then
            echo "::error::Repository secret KOOFR_APP_PASSWORD belum tersedia atau kosong."
            exit 1
          fi
          echo "Required Koofr secrets are available."
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "Pillow>=11,<13" "pillow-heif>=1.1,<2"
          python - <<'PYTHON'
          from PIL import features
          from pillow_heif import register_heif_opener
          register_heif_opener()
          if not features.check("webp"):
              raise SystemExit(
                  "::error::Pillow runner tidak mendukung WebP."
              )
          print("Pillow WebP support is available.")
          print("pillow-heif opener registered successfully.")
          PYTHON
      - name: Validate Python scripts
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile             scripts/build-koofr-catalog.py             scripts/build-koofr-media-previews.py
          echo "Python syntax validation passed."
      - name: Build fresh catalogue from Koofr
        shell: bash
        run: |
          set -euo pipefail
          rm -rf generated
          mkdir -p generated/site/assets/archive-media
          python scripts/build-koofr-catalog.py             --output generated/archive.json
      - name: Build WebP previews
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build-koofr-media-previews.py             --catalogue generated/archive.json             --output-root generated/site/assets/archive-media             --manifest generated/site/assets/archive-media/manifest.json             --url-prefix /assets/archive-media
      - name: Validate preview output
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYTHON'
          import json
          from pathlib import Path
          catalogue_path = Path("generated/archive.json")
          media_root = Path("generated/site/assets/archive-media")
          with catalogue_path.open("r", encoding="utf-8") as input_file:
              catalogue = json.load(input_file)
          total = 0
          ready = 0
          failed = 0
          for region in catalogue["regions"]:
              for district in region["districts"]:
                  for place in district["places"]:
                      for media in place["media"]:
                          total += 1
                          if media.get("previewStatus") == "ready":
                              ready += 1
                              for key in ("thumbnailUrl", "previewUrl"):
                                  url = media.get(key)
                                  if not isinstance(url, str):
                                      raise SystemExit(
                                          f"::error::{key} tidak valid untuk {media.get('id')}."
                                      )
                                  path = Path("generated/site") / url.lstrip("/")
                                  if not path.is_file():
                                      raise SystemExit(
                                          f"::error::File preview hilang: {path}"
                                      )
                          elif media.get("previewStatus") == "unavailable":
                              failed += 1
          if ready == 0:
              raise SystemExit(
                  "::error::Tidak ada preview yang berhasil dibuat."
              )
          generated_bytes = sum(
              path.stat().st_size
              for path in media_root.rglob("*.webp")
          )
          print(
              f"Preview validation passed: {ready}/{total} ready, "
              f"{failed} failed."
          )
          print(f"Generated media size: {generated_bytes:,} bytes.")
          PYTHON
      - name: Assemble downloadable artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p generated/artifact/assets
          cp generated/archive.json generated/artifact/archive.json
          cp -R             generated/site/assets/archive-media             generated/artifact/assets/archive-media
          echo "Artifact contents assembled."
      - name: Upload media preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: koofr-media-preview
          path: generated/artifact
          if-no-files-found: error
          retention-days: 7
      - name: Report completion
        shell: bash
        run: |
          echo "Koofr media preview completed."
          echo "No Koofr resource or repository file was changed."

<!doctype html>
<html lang="{{ site.lang | default: 'id' }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="google-site-verification" content="zLVI4kd6dOoIoMY0ow02fYqk3gRzpQZWYPVkVcFAUrw" />
    {% seo %}

    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  </head>

  <body>
    <header class="site-header">
      <div class="wrap">
        <a class="brand" href="{{ '/' | relative_url }}">
          <span class="brand__title">{{ site.title }}</span>
        </a>
      </div>
    </header>

    <main class="wrap">
      {{ content }}
    </main>

    <footer class="site-footer">
  <div class="wrap">
    <p>
      © {{ "now" | date: "%Y" }} {{ site.title }} ·
      <a href="{{ '/lisensi/' | relative_url }}">Lisensi (CC BY-NC-ND)</a>
    </p>
  </div>
</footer>
  </body>
</html>

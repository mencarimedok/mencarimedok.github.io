---
layout: default
---
<article class="post">
  <header class="post__header">
    <h1 class="h1">{{ page.title }}</h1>
    <p class="meta">{{ page.date | date: "%d %B %Y" }}</p>

    {% if page.cover %}
      <img class="post__cover" src="{{ page.cover | relative_url }}" alt="" loading="lazy" />
    {% endif %}
  </header>

  <div class="prose">
    {{ content }}
  </div>
</article>
